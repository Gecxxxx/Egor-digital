name: Cleanup ticker implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean ticker source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          old_component = '''function BenefitTicker() {
            const [paused, setPaused] = useState(false);
            return <div className={paused ? "ticker is-paused" : "ticker"} aria-label="Преимущества"><div className="ticker-track">{[...tickerItems, ...tickerItems].map((item, index) => <span aria-hidden={index >= tickerItems.length ? "true" : undefined} key={`${item}-${index}`}>{item}</span>)}</div><button type="button" className="ticker-toggle" aria-pressed={paused} onClick={() => setPaused((current) => !current)}>{paused ? "Запустить" : "Пауза"}</button></div>;
          }
          '''
          new_component = '''function BenefitTicker() {
            return <div className="ticker" aria-label="Преимущества"><div className="ticker-track">{[...tickerItems, ...tickerItems].map((item, index) => <span aria-hidden={index >= tickerItems.length ? "true" : undefined} key={`${item}-${index}`}>{item}</span>)}</div></div>;
          }
          '''
          replace_once("src/App.jsx", old_component, new_component, "BenefitTicker")

          css_path = Path("src/styles.css")
          css = css_path.read_text(encoding="utf-8")
          patterns = [
              (r'^\.ticker-toggle \{[^\n]*\}\n', "ticker toggle styles"),
              (r'^\.ticker\.is-paused \.ticker-track \{[^\n]*\}\n', "paused state styles"),
              (r'@media \(hover: hover\) and \(pointer: fine\) \{\n  \.ticker:hover \.ticker-track \{ animation-play-state: paused; \}\n\}\n\n', "hover pause styles"),
              (r'^  \.ticker-toggle \{ display: none; \}\n', "reduced motion ticker toggle styles"),
          ]
          for pattern, label in patterns:
              css, count = re.subn(pattern, "", css, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
          css_path.write_text(css, encoding="utf-8")

          replace_once("src/main.jsx", 'import "./ticker-fix.css";\n', "", "temporary stylesheet import")
          replace_once(
              "index.html",
              '    <style>.ticker-toggle{display:none!important}.ticker:hover .ticker-track{animation-play-state:running!important;-webkit-animation-play-state:running!important}</style>\n',
              "",
              "temporary inline ticker styles",
          )

          old_test = '''test("provides an explicit ticker pause control", async () => {
            const app = await readFile(new URL("../src/App.jsx", import.meta.url), "utf8");
            const css = await readFile(new URL("../src/styles.css", import.meta.url), "utf8");

            assert.match(app, /className="ticker-toggle" aria-pressed=\\{paused\\}/);
            assert.match(app, /paused \\? "Запустить" : "Пауза"/);
            assert.ok(css.includes(".ticker.is-paused .ticker-track { animation-play-state: paused;"));
          });
          '''
          new_test = '''test("keeps the ticker moving without interactive pause controls", async () => {
            const app = await readFile(new URL("../src/App.jsx", import.meta.url), "utf8");
            const css = await readFile(new URL("../src/styles.css", import.meta.url), "utf8");

            assert.match(app, /function BenefitTicker\\(\\) \\{\\n  return <div className="ticker"/);
            assert.doesNotMatch(app, /ticker-toggle|aria-pressed=\\{paused\\}|setPaused/);
            assert.doesNotMatch(css, /ticker-toggle|ticker\\.is-paused|ticker:hover \\.ticker-track/);
          });
          '''
          replace_once("tests/sites-worker.test.mjs", old_test, new_test, "ticker behavior test")

          fix_file = Path("src/ticker-fix.css")
          if not fix_file.exists():
              raise SystemExit("src/ticker-fix.css is missing")
          fix_file.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:sites

      - name: Commit clean implementation
        shell: bash
        run: |
          rm .github/workflows/cleanup-ticker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css src/main.jsx index.html src/ticker-fix.css tests/sites-worker.test.mjs .github/workflows/cleanup-ticker.yml
          git commit -m "fix: clean ticker controls and hover pause"
          git push origin main
